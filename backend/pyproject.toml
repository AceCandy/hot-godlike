[project]
name = "hot-godlike-backend"
version = "0.1.0"
description = "M1 query core for the multi-agent hot intelligence system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "apscheduler>=3.11.0,<4.0.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]
